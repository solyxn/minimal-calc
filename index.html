<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Calc</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background: #0f1115; color: #e1e4e8; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .calc { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .display { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: right; }
        .history { font-size: 12px; color: #8b949e; min-height: 18px; margin-bottom: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .result { font-size: 28px; font-weight: bold; color: #58a6ff; overflow-x: auto; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 15px; font-size: 16px; cursor: pointer; transition: 0.1s; user-select: none; }
        button:hover { background: #30363d; border-color: #8b949e; }
        button:active { background: #484f58; }
        button.op { background: #1f6feb; color: #fff; border-color: #388bfd; }
        button.op:hover { background: #388bfd; }
        button.span-2 { grid-column: span 2; }
    </style>
</head>
<body>
    <div class="calc">
        <div class="display">
            <div class="history" id="history"></div>
            <div class="result" id="result">0</div>
        </div>
        <div class="buttons">
            <button onclick="clearAll()">C</button>
            <button onclick="deleteChar()">⌫</button>
            <button onclick="percentage()" class="op">%</button>
            <button onclick="appendChar('÷')" class="op">÷</button>
            <button onclick="appendChar('7')">7</button>
            <button onclick="appendChar('8')">8</button>
            <button onclick="appendChar('9')">9</button>
            <button onclick="appendChar('×')" class="op">×</button>
            <button onclick="appendChar('4')">4</button>
            <button onclick="appendChar('5')">5</button>
            <button onclick="appendChar('6')">6</button>
            <button onclick="appendChar('-')" class="op">-</button>
            <button onclick="appendChar('1')">1</button>
            <button onclick="appendChar('2')">2</button>
            <button onclick="appendChar('3')">3</button>
            <button onclick="appendChar('+')" class="op">+</button>
            <button onclick="appendChar('0')" class="span-2">0</button>
            <button onclick="appendChar('.')">.</button>
            <button onclick="calculate()" class="op">=</button>
        </div>
    </div>
    <script>
        const resultEl = document.getElementById('result');
        const historyEl = document.getElementById('history');
        let currentInput = '0';
        let isError = false;
        let lastCalculation = localStorage.getItem('calc_last') || '';
        historyEl.innerText = lastCalculation;

        function updateDisplay() {
            resultEl.innerText = currentInput;
        }

        // Автоматический ресайз окна под WebView2
        window.addEventListener('DOMContentLoaded', () => {
            window.resizeTo(356, 545);
        });

        function appendChar(char) {
            if (isError) {
                clearAll();
            }

            const ops = ['+', '-', '×', '÷', '.'];
            
            if (ops.includes(char) && ops.includes(currentInput.slice(-1))) {
                currentInput = currentInput.slice(0, -1) + char;
                updateDisplay();
                return;
            }

            if (currentInput === '0' && !ops.includes(char)) {
                currentInput = char;
            } else {
                currentInput += char;
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            isError = false;
            updateDisplay();
        }

        function deleteChar() {
            if (isError) {
                clearAll();
                return;
            }
            currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
            updateDisplay();
        }

        function prepareExpression(str) {
            return str.replace(/×/g, '*').replace(/÷/g, '/');
        }

        function percentage() {
            if (isError) return;
            try {
                let expr = prepareExpression(currentInput);
                let evaluated = eval(expr) / 100;
                if (!isFinite(evaluated) || isNaN(evaluated)) throw new Error();
                currentInput = String(evaluated);
                updateDisplay();
            } catch {
                showError();
            }
        }

        function calculate() {
            if (isError) return;
            try {
                let expr = prepareExpression(currentInput);
                let evaluated = eval(expr);
                if (!isFinite(evaluated) || isNaN(evaluated)) throw new Error();
                
                lastCalculation = currentInput + ' = ' + evaluated;
                localStorage.setItem('calc_last', lastCalculation);
                historyEl.innerText = lastCalculation;
                
                currentInput = String(evaluated);
                updateDisplay();
            } catch {
                showError();
            }
        }

        function showError() {
            resultEl.innerText = 'Ошибка';
            currentInput = '0';
            isError = true;
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === '/') e.preventDefault();
            
            if (e.key >= '0' && e.key <= '9' || e.key === '.') {
                appendChar(e.key);
            } else if (e.key === '+') {
                appendChar('+');
            } else if (e.key === '-') {
                appendChar('-');
            } else if (e.key === '*') {
                appendChar('×');
            } else if (e.key === '/') {
                appendChar('÷');
            } else if (e.key === 'Enter' || e.key === '=') {
                calculate();
            } else if (e.key === 'Backspace') {
                deleteChar();
            } else if (e.key === 'Escape') {
                clearAll();
            }
        });
    </script>
</body>
</html>
